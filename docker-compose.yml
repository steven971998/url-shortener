version: "3.9"

services:

  frontend:
    build: ./frontend
    container_name: url-shortener-frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    restart: always

  api:
    build: ./backend
    container_name: url-shortener-api
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - redis
    environment:
      - MONGO_URI=mongodb://mongo:27017/url-shortener
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
    restart: always

  mongo:
    image: mongo:7
    container_name: url-shortener-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7
    container_name: url-shortener-redis
    ports:
      - "6379:6379"

volumes:
  mongo-data: